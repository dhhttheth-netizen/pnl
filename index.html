<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shortlist — Live PnL</title>
<style>
  :root{
    --bg:        #0a0d0f;
    --panel:     #11161a;
    --panel-2:   #161c20;
    --line:      #1d2429;
    --line-soft: #161b1f;
    --ink:       #cdd6db;
    --ink-dim:   #6b7780;
    --ink-faint: #424a50;
    --green:     #2ee6a8;
    --green-dim: #16332b;
    --red:       #ff5d5d;
    --red-dim:   #3a1818;
    --amber:     #e8b339;
    --accent:    #5b8cff;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family: "JetBrains Mono", "SF Mono", "Roboto Mono", Consolas, monospace;
    font-size:13px;
    min-height:100vh;
  }
  ::selection{ background:#264a40; }
  :focus-visible{ outline:1.5px solid var(--accent); outline-offset:1px; }

  /* ── Top bar ───────────────────────────────────────────── */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, #0d1113, #0a0d0f);
    position:sticky; top:0; z-index:20;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand .mark{ font-weight:700; letter-spacing:0.5px; color:var(--ink); font-size:15px; }
  .brand .mark span{ color:var(--green); }
  .brand .sub{ color:var(--ink-dim); font-size:11px; letter-spacing:0.5px; }

  .status-cluster{ display:flex; align-items:center; gap:18px; font-size:11px; color:var(--ink-dim); }
  .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px; position:relative; top:1px; }
  .dot.live{ background:var(--green); box-shadow:0 0 8px var(--green); }
  .dot.off{  background:var(--ink-dim); }
  .dot.closed{ background:var(--amber); box-shadow:0 0 8px var(--amber); }
  .dot.bad{ background:var(--red); box-shadow:0 0 8px var(--red); }

  button.icon-btn{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:4px;
    padding:5px 10px;
    font-family:inherit;
    font-size:11px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:background .12s ease, border-color .12s ease;
  }
  button.icon-btn:hover{ background:#1c2328; border-color:#2a333a; }
  button.icon-btn.active{ border-color:var(--green); color:var(--green); }

  /* ── Summary strip ────────────────────────────────────── */
  .summary{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:1px;
    background:var(--line);
    border-bottom:1px solid var(--line);
  }
  .summary .cell{ background:var(--panel); padding:16px 20px; }
  .summary .label{ color:var(--ink-dim); font-size:10.5px; letter-spacing:0.8px; text-transform:uppercase; margin-bottom:6px; }
  .summary .value{ font-size:22px; font-weight:700; letter-spacing:-0.3px; font-variant-numeric: tabular-nums; transition:color .2s ease; }
  .summary .value.pos{ color:var(--green); }
  .summary .value.neg{ color:var(--red); }
  .summary .value.neutral{ color:var(--ink); }
  .summary .value.flash{ animation:flash 0.6s ease; }
  @keyframes flash{ 0%{ opacity:.45; } 100%{ opacity:1; } }

  /* ── Toolbar ───────────────────────────────────────────── */
  .toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 20px 0;
    flex-wrap:wrap;
  }
  .tabs{ display:flex; gap:6px; }
  .tab{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--ink-dim);
    border-radius:4px;
    padding:6px 12px;
    font-family:inherit;
    font-size:11px;
    letter-spacing:0.3px;
    cursor:pointer;
  }
  .tab:hover{ color:var(--ink); }
  .tab.active{ color:var(--bg); background:var(--green); border-color:var(--green); font-weight:700; }

  .search-wrap{
    margin-left:auto;
    position:relative;
    display:flex;
    align-items:center;
  }
  .search-wrap svg{
    position:absolute; left:9px; width:13px; height:13px;
    stroke:var(--ink-dim); pointer-events:none;
  }
  #search{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:4px;
    padding:7px 10px 7px 28px;
    font-family:inherit;
    font-size:12px;
    width:180px;
    transition:width .15s ease, border-color .15s ease;
  }
  #search:focus{ width:230px; border-color:var(--accent); }
  #search::placeholder{ color:var(--ink-faint); }

  /* ── Table ─────────────────────────────────────────────── */
  main{ padding:14px 20px 20px; }

  .table-wrap{
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
    background:var(--panel);
  }

  table{ width:100%; border-collapse:collapse; }

  thead th{
    text-align:left;
    font-size:10.5px;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:var(--ink-dim);
    font-weight:600;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    background:#0d1113;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
    transition:color .12s ease;
  }
  thead th:hover{ color:var(--ink); }
  thead th.num{ text-align:right; }
  thead th .arrow{ display:inline-block; width:9px; opacity:0; margin-left:3px; }
  thead th.sorted .arrow{ opacity:1; color:var(--green); }
  thead th.sorted{ color:var(--ink); }

  tbody td{
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody tr.data-row{ cursor:pointer; transition:background .1s ease; }
  tbody tr.data-row:hover{ background:#141a1e; }
  tbody tr.data-row.expanded{ background:#12181c; }
  tbody tr:last-child td{ border-bottom:none; }

  td.num{ text-align:right; font-variant-numeric: tabular-nums; }
  td.sym{ font-weight:700; letter-spacing:0.3px; }
  td.sym .chev{
    display:inline-block; width:10px; margin-right:4px;
    color:var(--ink-faint); transition:transform .15s ease;
    font-size:10px;
  }
  tr.expanded td.sym .chev{ transform:rotate(90deg); color:var(--green); }
  td.basket{ color:var(--ink-dim); font-size:11px; }
  .occ-badge{
    display:inline-block; margin-left:6px; padding:1px 6px; border-radius:3px;
    background:#1b2a25; color:var(--green); font-size:10px; font-weight:700;
  }

  .pnl.pos{ color:var(--green); font-weight:700; }
  .pnl.neg{ color:var(--red); font-weight:700; }
  .pnl.zero{ color:var(--ink-dim); }

  /* tick flash on value change */
  .tick-up{ animation:tickUp .5s ease; }
  .tick-down{ animation:tickDown .5s ease; }
  @keyframes tickUp{ 0%{ background:var(--green-dim); } 100%{ background:transparent; } }
  @keyframes tickDown{ 0%{ background:var(--red-dim); } 100%{ background:transparent; } }

  .note{ color:var(--amber); font-size:11px; }

  /* expanded detail row */
  tr.detail-row td{
    background:#0d1113;
    padding:14px 18px 18px;
  }
  .detail-grid{
    display:flex;
    gap:24px;
    align-items:flex-end;
  }
  .spark-box{ flex:1; min-width:0; }
  .spark-box .spark-label{
    color:var(--ink-dim); font-size:10px; letter-spacing:0.6px; text-transform:uppercase; margin-bottom:8px;
  }
  .spark-stats{
    display:flex; gap:20px; white-space:nowrap;
  }
  .spark-stats .stat .l{ color:var(--ink-dim); font-size:10px; text-transform:uppercase; letter-spacing:.5px; }
  .spark-stats .stat .v{ font-size:15px; font-weight:700; font-variant-numeric: tabular-nums; }

  .empty-state{ padding:48px 20px; text-align:center; color:var(--ink-dim); }
  .empty-state .big{ font-size:14px; color:var(--ink); margin-bottom:6px; }

  footer{
    padding:14px 20px;
    color:var(--ink-dim);
    font-size:11px;
    display:flex;
    justify-content:space-between;
  }

  code{ background:#0d1113; padding:2px 5px; border-radius:3px; color:var(--ink); }

  @media (max-width:720px){
    .summary{ grid-template-columns: repeat(2, 1fr); }
    thead th:nth-child(2), td:nth-child(2){ display:none; }
    #search{ width:120px; }
    #search:focus{ width:160px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">SHORTLIST<span>::</span>PNL</div>
    <div class="sub">live mark-to-market</div>
  </div>
  <div class="status-cluster">
    <span id="market-state"><span class="dot off"></span>checking market…</span>
    <span id="conn-state"><span class="dot off"></span>connecting…</span>
    <span id="last-update">—</span>
    <button class="icon-btn" id="pause-btn" title="Pause live updates">⏸ pause</button>
  </div>
</header>

<div class="summary">
  <div class="cell"><div class="label">Today's PnL</div><div class="value neutral" id="total-pnl">₹0</div></div>
  <div class="cell"><div class="label">Open Positions</div><div class="value neutral" id="open-count">0</div></div>
  <div class="cell"><div class="label">Winners / Losers</div><div class="value neutral" id="win-loss">0 / 0</div></div>
  <div class="cell"><div class="label">Capital / Trade</div><div class="value neutral" id="capital">—</div></div>
</div>

<div class="toolbar">
  <div class="tabs" id="basket-tabs">
    <button class="tab active" data-basket="ALL">ALL</button>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" placeholder="filter symbol…" autocomplete="off" />
  </div>
</div>

<main>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-key="symbol">Symbol<span class="arrow">▾</span></th>
          <th data-key="basket">Basket<span class="arrow">▾</span></th>
          <th class="num" data-key="entry_price">Entry (Open)<span class="arrow">▾</span></th>
          <th class="num" data-key="ltp">LTP<span class="arrow">▾</span></th>
          <th class="num" data-key="qty">Qty<span class="arrow">▾</span></th>
          <th class="num" data-key="pnl_pct">PnL %<span class="arrow">▾</span></th>
          <th class="num sorted" data-key="pnl">PnL ₹<span class="arrow">▾</span></th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="7" style="padding:0;">
          <div class="empty-state">
            <div class="big">Waiting for data…</div>
            <div>Make sure the backend is running and reachable.</div>
          </div>
        </td></tr>
      </tbody>
    </table>
  </div>
</main>

<footer>
  <span id="shortlist-file">—</span>
  <span>backend: <code id="backend-url">http://localhost:8000</code></span>
</footer>

<script>
  // ── Config ──────────────────────────────────────────────
  // Auto-detects environment: localhost during dev, your Render backend in prod.
  const IS_LOCAL = ["localhost", "127.0.0.1"].includes(window.location.hostname);
  const BACKEND_HOST = "shortlist-pnl-backend.onrender.com"; // <-- your Render backend service name
  const API_BASE = IS_LOCAL ? "http://localhost:8000" : `https://${BACKEND_HOST}`;
  const WS_URL   = IS_LOCAL ? "ws://localhost:8000/ws/live" : `wss://${BACKEND_HOST}/ws/live`;
  const MAX_HISTORY = 120; // ~10 min of 5s ticks per symbol, kept in memory

  const fmtMoney = (n) => {
    if (n === null || n === undefined) return "—";
    const sign = n < 0 ? "-" : "";
    return sign + "₹" + Math.abs(n).toLocaleString("en-IN", {maximumFractionDigits:2});
  };
  const fmtNum = (n) => (n === null || n === undefined) ? "—" : n.toLocaleString("en-IN");
  const pnlClass = (n) => n > 0 ? "pos" : (n < 0 ? "neg" : "zero");

  // ── State ───────────────────────────────────────────────
  let latestData   = null;        // last full payload from server
  let history      = {};          // symbol -> [ltp, ltp, ...]
  let prevValues   = {};          // symbol -> { ltp, pnl } for tick-flash diffing
  let sortKey      = "pnl";
  let sortDir      = -1;          // -1 desc, 1 asc
  let activeBasket = "ALL";
  let searchTerm   = "";
  let expandedSym  = null;
  let paused       = false;
  let pendingData  = null;        // payload received while paused

  let ws = null;
  let reconnectTimer = null;
  let reconnectDelay = 1000;      // backoff: 1s, 2s, 4s ... capped
  let connState = "connecting";   // connecting | live | retrying

  // ── Connection status (state machine, no flicker) ────────
  function setConn(state){
    if(state === connState) return;
    connState = state;
    const el = document.getElementById("conn-state");
    if(state === "live"){
      el.innerHTML = '<span class="dot live"></span>live feed';
    } else if(state === "connecting"){
      el.innerHTML = '<span class="dot off"></span>connecting…';
    } else {
      el.innerHTML = '<span class="dot bad"></span>disconnected — retrying';
    }
  }

  function connectWS(){
    if(connState !== "live") setConn("connecting");
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      setConn("live");
      reconnectDelay = 1000; // reset backoff on success
    };
    ws.onmessage = (evt) => {
      try{
        const data = JSON.parse(evt.data);
        if(paused){ pendingData = data; return; }
        ingest(data);
      }catch(e){ console.error("bad payload", e); }
    };
    ws.onclose = () => {
      setConn("retrying");
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connectWS, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 1.6, 15000);
    };
    ws.onerror = () => ws.close();
  }

  // ── Pause / resume ────────────────────────────────────────
  document.getElementById("pause-btn").addEventListener("click", () => {
    paused = !paused;
    const btn = document.getElementById("pause-btn");
    if(paused){
      btn.classList.add("active");
      btn.innerHTML = "▶ resume";
    } else {
      btn.classList.remove("active");
      btn.innerHTML = "⏸ pause";
      if(pendingData){ ingest(pendingData); pendingData = null; }
    }
  });

  // ── Ingest a new payload: update history, then render ───
  function ingest(data){
    latestData = data;
    if(data.positions){
      for(const p of data.positions){
        if(p.ltp === null || p.ltp === undefined) continue;
        if(!history[p.symbol]) history[p.symbol] = [];
        const h = history[p.symbol];
        h.push(p.ltp);
        if(h.length > MAX_HISTORY) h.shift();
      }
    }
    renderAll();
  }

  // ── Basket tabs (rebuilt whenever the basket set changes) ─
  let knownBaskets = new Set();
  function rebuildTabs(positions){
    const baskets = new Set();
    positions.forEach(p => {
      (p.basket || "").split("+").forEach(b => { if(b.trim()) baskets.add(b.trim()); });
    });
    const sameSet = baskets.size === knownBaskets.size &&
      [...baskets].every(b => knownBaskets.has(b));
    if(sameSet) return;
    knownBaskets = baskets;

    const wrap = document.getElementById("basket-tabs");
    const tabs = ["ALL", ...Array.from(baskets).sort()];
    wrap.innerHTML = tabs.map(b =>
      `<button class="tab${b===activeBasket ? " active" : ""}" data-basket="${b}">${b}</button>`
    ).join("");
    wrap.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        activeBasket = btn.dataset.basket;
        wrap.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
        renderAll();
      });
    });
  }

  // ── Sorting ────────────────────────────────────────────────
  document.querySelectorAll("thead th[data-key]").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if(sortKey === key){
        sortDir *= -1;
      } else {
        sortKey = key;
        sortDir = -1;
      }
      document.querySelectorAll("thead th").forEach(h => h.classList.remove("sorted"));
      th.classList.add("sorted");
      th.querySelector(".arrow").textContent = sortDir === -1 ? "▾" : "▴";
      renderAll();
    });
  });

  // ── Search ─────────────────────────────────────────────────
  document.getElementById("search").addEventListener("input", (e) => {
    searchTerm = e.target.value.trim().toUpperCase();
    renderAll();
  });

  // ── Sparkline SVG builder ───────────────────────────────────
  function buildSparkline(values, w=560, h=64){
    if(!values || values.length < 2){
      return `<div style="color:var(--ink-faint); font-size:11px;">collecting price history…</div>`;
    }
    const min = Math.min(...values), max = Math.max(...values);
    const range = (max - min) || 1;
    const stepX = w / (values.length - 1);
    const pts = values.map((v, i) => {
      const x = i * stepX;
      const y = h - ((v - min) / range) * h;
      return [x, y];
    });
    const path = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    const first = values[0], last = values[values.length - 1];
    const up = last <= first; // for a SHORT, price falling = good = green
    const stroke = up ? "var(--green)" : "var(--red)";
    const fillId = "sg" + Math.random().toString(36).slice(2,8);
    const areaPath = path + ` L${w},${h} L0,${h} Z`;
    return `
      <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
        <defs>
          <linearGradient id="${fillId}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${stroke}" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="${stroke}" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="${areaPath}" fill="url(#${fillId})" stroke="none"/>
        <path d="${path}" fill="none" stroke="${stroke}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>`;
  }

  // ── Row click → expand/collapse ─────────────────────────────
  function toggleExpand(sym){
    expandedSym = (expandedSym === sym) ? null : sym;
    renderAll();
  }

  // ── Main render ──────────────────────────────────────────────
  function renderAll(){
    if(!latestData) return;
    const data = latestData;

    document.getElementById("backend-url").textContent = API_BASE;

    if(data.error){
      document.getElementById("rows").innerHTML = `
        <tr><td colspan="7" style="padding:0;">
          <div class="empty-state">
            <div class="big">${data.error}</div>
            <div>Check <code>SHORTLIST_FILE</code> path and that the CSV exists.</div>
          </div>
        </td></tr>`;
      document.getElementById("total-pnl").textContent = "₹0";
      document.getElementById("open-count").textContent = "0";
      document.getElementById("win-loss").textContent = "0 / 0";
      return;
    }

    const marketEl = document.getElementById("market-state");
    marketEl.innerHTML = data.market_open
      ? '<span class="dot live"></span>market open'
      : '<span class="dot closed"></span>market closed';

    document.getElementById("shortlist-file").textContent = data.shortlist_file
      ? `source: ${data.shortlist_file}` : "";
    document.getElementById("last-update").textContent =
      "updated " + new Date(data.ts).toLocaleTimeString();

    let positions = data.positions || [];
    rebuildTabs(positions);

    // ── filter: basket tab ──
    if(activeBasket !== "ALL"){
      positions = positions.filter(p => (p.basket || "").split("+").includes(activeBasket));
    }
    // ── filter: search ──
    if(searchTerm){
      positions = positions.filter(p => p.symbol.toUpperCase().includes(searchTerm));
    }

    // ── summary (computed on the FULL unfiltered set) ──
    const allPositions = data.positions || [];
    setSummaryValue("total-pnl", fmtMoney(data.today_pnl), data.today_pnl);
    document.getElementById("open-count").textContent = allPositions.length;
    const winners = allPositions.filter(p => (p.pnl || 0) > 0).length;
    const losers  = allPositions.filter(p => (p.pnl || 0) < 0).length;
    document.getElementById("win-loss").textContent = `${winners} / ${losers}`;

    // ── sort ──
    positions = positions.slice().sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if(typeof av === "string" || typeof bv === "string"){
        av = (av || "").toString(); bv = (bv || "").toString();
        return av.localeCompare(bv) * sortDir;
      }
      av = (av === null || av === undefined) ? -Infinity : av;
      bv = (bv === null || bv === undefined) ? -Infinity : bv;
      return (av - bv) * sortDir;
    });

    const tbody = document.getElementById("rows");
    if(positions.length === 0){
      tbody.innerHTML = `
        <tr><td colspan="7" style="padding:0;">
          <div class="empty-state">
            <div class="big">No matching positions</div>
            <div>Try clearing the search or switching baskets.</div>
          </div>
        </td></tr>`;
      return;
    }

    const rowsHtml = positions.map(p => {
      const isExpanded = expandedSym === p.symbol;
      const occBadge = p.occurrences && p.occurrences > 1
        ? `<span class="occ-badge">×${p.occurrences}</span>` : "";

      if(p.note){
        return `
          <tr class="data-row" data-sym="${p.symbol}">
            <td class="sym"><span class="chev">▸</span>${p.symbol}</td>
            <td class="basket">${p.basket || ""}</td>
            <td class="num" colspan="5"><span class="note">${p.note}</span></td>
          </tr>`;
      }

      // tick-flash detection
      const prev = prevValues[p.symbol] || {};
      const ltpTick = prev.ltp !== undefined && p.ltp !== prev.ltp
        ? (p.ltp < prev.ltp ? "tick-up" : "tick-down") : "";
      const pnlTick = prev.pnl !== undefined && p.pnl !== prev.pnl
        ? (p.pnl > prev.pnl ? "tick-up" : "tick-down") : "";
      prevValues[p.symbol] = { ltp: p.ltp, pnl: p.pnl };

      const mainRow = `
        <tr class="data-row${isExpanded ? " expanded" : ""}" data-sym="${p.symbol}">
          <td class="sym"><span class="chev">▸</span>${p.symbol}${occBadge}</td>
          <td class="basket">${p.basket || ""}</td>
          <td class="num">${p.entry_price !== null ? p.entry_price.toFixed(2) : "—"}</td>
          <td class="num ${ltpTick}">${p.ltp !== null ? p.ltp.toFixed(2) : "—"}</td>
          <td class="num">${fmtNum(p.qty)}</td>
          <td class="num pnl ${pnlClass(p.pnl_pct || 0)}">${p.pnl_pct !== null ? p.pnl_pct.toFixed(2) + "%" : "—"}</td>
          <td class="num pnl ${pnlClass(p.pnl || 0)} ${pnlTick}">${fmtMoney(p.pnl)}</td>
        </tr>`;

      if(!isExpanded) return mainRow;

      const hist = history[p.symbol] || [];
      const spark = buildSparkline(hist);
      const sessionHigh = hist.length ? Math.max(...hist) : null;
      const sessionLow  = hist.length ? Math.min(...hist) : null;

      const detailRow = `
        <tr class="detail-row" data-sym="${p.symbol}">
          <td colspan="7">
            <div class="detail-grid">
              <div class="spark-box">
                <div class="spark-label">price path · this session (${hist.length} ticks)</div>
                ${spark}
              </div>
              <div class="spark-stats">
                <div class="stat"><div class="l">Session High</div><div class="v">${sessionHigh !== null ? sessionHigh.toFixed(2) : "—"}</div></div>
                <div class="stat"><div class="l">Session Low</div><div class="v">${sessionLow !== null ? sessionLow.toFixed(2) : "—"}</div></div>
                <div class="stat"><div class="l">Entry</div><div class="v">${p.entry_price !== null ? p.entry_price.toFixed(2) : "—"}</div></div>
                <div class="stat"><div class="l">PnL</div><div class="v pnl ${pnlClass(p.pnl || 0)}">${fmtMoney(p.pnl)}</div></div>
              </div>
            </div>
          </td>
        </tr>`;

      return mainRow + detailRow;
    }).join("");

    tbody.innerHTML = rowsHtml;

    // attach click handlers (delegation would be simpler, but rows are rebuilt each time)
    tbody.querySelectorAll("tr.data-row").forEach(tr => {
      tr.addEventListener("click", () => toggleExpand(tr.dataset.sym));
    });
  }

  function setSummaryValue(id, text, raw){
    const el = document.getElementById(id);
    const newClass = "value " + (raw > 0 ? "pos" : raw < 0 ? "neg" : "neutral");
    if(el.textContent !== text){
      el.textContent = text;
      el.className = newClass;
      el.classList.add("flash");
      setTimeout(() => el.classList.remove("flash"), 600);
    } else {
      el.className = newClass;
    }
  }

  // ── Initial REST load (fast first paint before WS connects) ──
  async function loadOnce(){
    try{
      const res = await fetch(`${API_BASE}/api/live/pnl`);
      const data = await res.json();
      ingest(data);
    }catch(err){
      document.getElementById("rows").innerHTML = `
        <tr><td colspan="7" style="padding:0;">
          <div class="empty-state">
            <div class="big">Can't reach backend at ${API_BASE}</div>
            <div>${IS_LOCAL ? "Run <code>uvicorn main:app --reload --port 8000</code> and reload this page." : "Check that the backend service is deployed and running on Render."}</div>
          </div>
        </td></tr>`;
    }
  }

  async function loadHealth(){
    try{
      const res = await fetch(`${API_BASE}/`);
      const data = await res.json();
      document.getElementById("capital").textContent = fmtMoney(data.capital_per_trade);
    }catch(err){ /* silent */ }
  }

  loadOnce();
  loadHealth();
  connectWS();
</script>
</body>
</html>
