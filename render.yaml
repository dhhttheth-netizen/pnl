services:
  # ── 1. Backend: FastAPI PnL API + WebSocket ───────────────────
  - type: web
    name: shortlist-pnl-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-backend.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SHORTLIST_FILE
        value: shortlist_latest.csv
      - key: CAPITAL_PER_TRADE
        value: "50000"

  # ── 2. Frontend: static dashboard ──────────────────────────────
  - type: web
    name: shortlist-pnl-dashboard
    runtime: static
    plan: free
    buildCommand: ""
    staticPublishPath: .

  # ── 3. Token webpage: paste today's Upstox token each morning ──
  - type: web
    name: shortlist-token-updater
    runtime: python
    plan: free
    buildCommand: pip install -r token-webpage/requirements.txt
    startCommand: uvicorn token_server:app --host 0.0.0.0 --port $PORT --app-dir token-webpage
    envVars:
      - key: GITHUB_PAT
        sync: false       # you'll paste this once in Render's dashboard, not in code
      - key: GITHUB_REPO
        sync: false       # e.g. "yourname/shortlist-pnl"
      - key: PAGE_PASSWORD
        sync: false       # a password YOU pick to protect this page
