services:
  # ── 1. Backend: FastAPI PnL API + WebSocket ───────────────────
  - type: web
    name: shortlist-pnl-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-backend.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SHORTLIST_FILE
        value: shortlist_latest.csv
      - key: CAPITAL_PER_TRADE
        value: "50000"

  # ── 2. Frontend: static dashboard ──────────────────────────────
  - type: web
    name: shortlist-pnl-dashboard
    runtime: static
    plan: free
    buildCommand: ""
    staticPublishPath: .
